<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="'Microsoft YaHei','SimHei',sans-serif">
<defs>
  <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4A90D9"/></marker>
  <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#BDC3C7"/></marker>
  <marker id="arr-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#F5A623"/></marker>
  <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7ED321"/></marker>
  <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D0021B"/></marker>
  <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15"/></filter>
  <style>
    .title{font-size:24px;font-weight:bold;fill:#2C3E50}
    .subtitle{font-size:13px;fill:#7F8C8D}
    .section{font-size:14px;font-weight:bold}
    .box-label{font-size:12px;font-weight:bold;fill:#fff}
    .box-sub{font-size:10px;fill:#fff;opacity:0.9}
    .desc{font-size:10px;fill:#5D6D7E}
    .tok{font-size:11px;font-weight:bold}
    .cut{font-size:9px;fill:#BDC3C7}
    .compare-title{font-size:12px;font-weight:bold}
    .compare-text{font-size:10px}
    .save-num{font-size:20px;font-weight:bold;fill:#27AE60}
  </style>
</defs>

<text x="600" y="38" text-anchor="middle" class="title" xml:space="preserve">MemoryPolicy 角色裁剪流程</text>
<text x="600" y="60" text-anchor="middle" class="subtitle" xml:space="preserve">5 层记忆 → 按消费者角色裁剪 → 精准注入 Prompt</text>
<text x="110" y="100" text-anchor="#4A90D9" class="section" xml:space="preserve">输入</text>
<rect x="30" y="115" width="160" height="32" rx="8" fill="#4A90D9" opacity="1.0" stroke="none" filter="url(#shadow)"/>
<text x="110" y="136" text-anchor="middle" class="box-label" xml:space="preserve">user_id + session</text>
<rect x="30" y="160" width="160" height="32" rx="8" fill="#4A90D9" opacity="1.0" stroke="none" filter="url(#shadow)"/>
<text x="110" y="181" text-anchor="middle" class="box-label" xml:space="preserve">messages[] 对话历史</text>
<rect x="30" y="205" width="160" height="32" rx="8" fill="#4A90D9" opacity="1.0" stroke="none" filter="url(#shadow)"/>
<text x="110" y="226" text-anchor="middle" class="box-label" xml:space="preserve">profile_updates</text>
<text x="400" y="100" text-anchor="#1A5276" class="section" xml:space="preserve">5 层记忆 (load_layers)</text>
<rect x="270" y="120" width="120" height="38" rx="6" fill="#67B7DC" opacity="1.0" stroke="none" filter="url(#shadow)"/>
<text x="330" y="136" text-anchor="middle" class="box-label" xml:space="preserve">Session</text>
<text x="330" y="150" text-anchor="middle" class="box-sub" xml:space="preserve">44 tok</text>
<text x="400" y="142" text-anchor="start" class="desc" xml:space="preserve">会话ID · 渠道 · 临时标记</text>
<rect x="270" y="168" width="120" height="38" rx="6" fill="#67B7DC" opacity="1.0" stroke="none" filter="url(#shadow)"/>
<text x="330" y="184" text-anchor="middle" class="box-label" xml:space="preserve">Profile</text>
<text x="330" y="198" text-anchor="middle" class="box-sub" xml:space="preserve">73 tok</text>
<text x="400" y="190" text-anchor="start" class="desc" xml:space="preserve">画像：节奏 · 预算 · 偏好</text>
<rect x="270" y="216" width="120" height="38" rx="6" fill="#67B7DC" opacity="1.0" stroke="none" filter="url(#shadow)"/>
<text x="330" y="232" text-anchor="middle" class="box-label" xml:space="preserve">Summary</text>
<text x="330" y="246" text-anchor="middle" class="box-sub" xml:space="preserve">120 tok</text>
<text x="400" y="238" text-anchor="start" class="desc" xml:space="preserve">对话摘要 (≤1600字)</text>
<rect x="270" y="264" width="120" height="38" rx="6" fill="#67B7DC" opacity="1.0" stroke="none" filter="url(#shadow)"/>
<text x="330" y="280" text-anchor="middle" class="box-label" xml:space="preserve">SlidingWindow</text>
<text x="330" y="294" text-anchor="middle" class="box-sub" xml:space="preserve">159 tok</text>
<text x="400" y="286" text-anchor="start" class="desc" xml:space="preserve">滑动窗口 (最近6条消息)</text>
<rect x="270" y="312" width="120" height="38" rx="6" fill="#67B7DC" opacity="1.0" stroke="none" filter="url(#shadow)"/>
<text x="330" y="328" text-anchor="middle" class="box-label" xml:space="preserve">Skills</text>
<text x="330" y="342" text-anchor="middle" class="box-sub" xml:space="preserve">69 tok</text>
<text x="400" y="334" text-anchor="start" class="desc" xml:space="preserve">可复用技能 (历史路书路径)</text>
<rect x="270" y="360" width="120" height="28" rx="6" fill="#1A5276" opacity="1.0" stroke="none" filter="url(#shadow)"/>
<text x="330" y="379" text-anchor="middle" class="box-label" xml:space="preserve">合计: 483 tok</text>
<line x1="190" y1="131" x2="270" y2="139" stroke="#4A90D9" stroke-width="2" marker-end="url(#arr-blue)"/>
<path d="M190 176 C 220 176, 240 187, 270 187" fill="none" stroke="#4A90D9" stroke-width="1.5" marker-end="url(#arr-blue)"/>
<path d="M190 221 C 220 221, 240 233, 270 233" fill="none" stroke="#4A90D9" stroke-width="1.5" marker-end="url(#arr-blue)"/>
<rect x="470" y="170" width="160" height="110" rx="10" fill="#34495E" opacity="0.08" stroke="#34495E" filter="url(#shadow)"/>
<rect x="470" y="170" width="160" height="110" rx="10" fill="none" stroke="#34495E" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="550" y="200" text-anchor="#2C3E50" class="section" xml:space="preserve">MemoryPolicy</text>
<text x="550" y="222" text-anchor="middle" class="desc" xml:space="preserve">.render(layers,</text>
<text x="550" y="238" text-anchor="middle" class="desc" xml:space="preserve">    consumer)</text>
<text x="550" y="258" text-anchor="middle" class="desc" xml:space="preserve">按角色裁剪</text>
<text x="550" y="272" text-anchor="middle" class="desc" xml:space="preserve">仅返回所需层</text>
<line x1="390" y1="139" x2="470" y2="225" stroke="#BDC3C7" stroke-width="1" marker-end="url(#arr-gray)" stroke-dasharray="3,2"/>
<line x1="390" y1="187" x2="470" y2="225" stroke="#BDC3C7" stroke-width="1" marker-end="url(#arr-gray)" stroke-dasharray="3,2"/>
<line x1="390" y1="235" x2="470" y2="225" stroke="#BDC3C7" stroke-width="1" marker-end="url(#arr-gray)" stroke-dasharray="3,2"/>
<line x1="390" y1="283" x2="470" y2="225" stroke="#BDC3C7" stroke-width="1" marker-end="url(#arr-gray)" stroke-dasharray="3,2"/>
<line x1="390" y1="331" x2="470" y2="225" stroke="#BDC3C7" stroke-width="1" marker-end="url(#arr-gray)" stroke-dasharray="3,2"/>
<text x="900" y="100" text-anchor="#8E44AD" class="section" xml:space="preserve">消费者节点 (Agent)</text>
<rect x="760" y="120" width="280" height="36" rx="8" fill="#F5A623" opacity="1.0" stroke="none" filter="url(#shadow)"/>
<text x="900" y="143" text-anchor="middle" class="box-label" xml:space="preserve">Briefing Agent</text>
<rect x="760" y="162" width="280" height="30" rx="6" fill="#F5A623" opacity="0.2" stroke="none" filter="url(#shadow)"/>
<text x="900" y="182" text-anchor="middle" class="desc" xml:space="preserve">✓ flags + profile + summary + window</text>
<text x="900" y="196" text-anchor="#F5A623" class="tok" xml:space="preserve">380 tok</text>
<text x="1042" y="196" text-anchor="start" class="cut" xml:space="preserve">✗ skills</text>
<path d="M630 215 C 680 180, 720 138, 760 138" fill="none" stroke="#F5A623" stroke-width="2.5" marker-end="url(#arr-orange)"/>
<rect x="760" y="260" width="280" height="36" rx="8" fill="#7ED321" opacity="1.0" stroke="none" filter="url(#shadow)"/>
<text x="900" y="283" text-anchor="middle" class="box-label" xml:space="preserve">Writer Agent</text>
<rect x="760" y="302" width="280" height="30" rx="6" fill="#7ED321" opacity="0.2" stroke="none" filter="url(#shadow)"/>
<text x="900" y="322" text-anchor="middle" class="desc" xml:space="preserve">✓ profile + summary + skills</text>
<text x="900" y="336" text-anchor="#7ED321" class="tok" xml:space="preserve">275 tok</text>
<text x="1042" y="336" text-anchor="start" class="cut" xml:space="preserve">✗ session + window</text>
<path d="M630 225 C 680 250, 720 278, 760 278" fill="none" stroke="#7ED321" stroke-width="2.5" marker-end="url(#arr-green)"/>
<rect x="760" y="400" width="280" height="36" rx="8" fill="#D0021B" opacity="1.0" stroke="none" filter="url(#shadow)"/>
<text x="900" y="423" text-anchor="middle" class="box-label" xml:space="preserve">Tool Agent (Scout)</text>
<rect x="760" y="442" width="280" height="30" rx="6" fill="#D0021B" opacity="0.2" stroke="none" filter="url(#shadow)"/>
<text x="900" y="462" text-anchor="middle" class="desc" xml:space="preserve">✓ session + skills</text>
<text x="900" y="476" text-anchor="#D0021B" class="tok" xml:space="preserve">121 tok</text>
<text x="1042" y="476" text-anchor="start" class="cut" xml:space="preserve">✗ profile+summary+window</text>
<path d="M630 240 C 680 320, 720 418, 760 418" fill="none" stroke="#D0021B" stroke-width="2.5" marker-end="url(#arr-red)"/>
<line x1="30" y1="540" x2="1170" y2="540" stroke="#ECF0F1" stroke-width="2"/>
<rect x="60" y="565" width="280" height="100" rx="8" fill="#FDEDEC" opacity="0.6" stroke="#E74C3C" filter="url(#shadow)"/>
<text x="200" y="590" text-anchor="#C0392B" class="compare-title" xml:space="preserve">RAG 检索记忆 (对比)</text>
<text x="200" y="612" text-anchor="#E74C3C" class="compare-text" xml:space="preserve">final_k=5 chunks</text>
<text x="200" y="628" text-anchor="#E74C3C" class="compare-text" xml:space="preserve">每次注入 1320 tokens</text>
<text x="200" y="644" text-anchor="#999" class="compare-text" xml:space="preserve">所有消费者无差别全量注入</text>
<text x="200" y="660" text-anchor="#999" class="compare-text" xml:space="preserve">含 45% 元数据开销</text>
<line x1="340" y1="615" x2="430" y2="615" stroke="#E74C3C" stroke-width="2" marker-end="url(#arr-red)"/>
<rect x="430" y="565" width="300" height="100" rx="8" fill="#EAFAF1" opacity="0.7" stroke="#27AE60" filter="url(#shadow)"/>
<text x="580" y="590" text-anchor="#27AE60" class="compare-title" xml:space="preserve">Token 节省</text>
<text x="580" y="620" text-anchor="middle" class="save-num" xml:space="preserve">单次调用: 71% - 91%</text>
<text x="580" y="645" text-anchor="#27AE60" class="compare-text" xml:space="preserve">完整规划周期 (17次调用):</text>
<text x="580" y="660" text-anchor="#27AE60" class="compare-text" xml:space="preserve">节省 89% token (19970/22440)</text>
<rect x="770" y="565" width="380" height="100" rx="8" fill="#F8F9FA" opacity="0.8" stroke="#BDC3C7" filter="url(#shadow)"/>
<text x="960" y="590" text-anchor="#2C3E50" class="compare-title" xml:space="preserve">节省归因</text>
<text x="960" y="610" text-anchor="#5D6D7E" class="compare-text" xml:space="preserve">① 角色裁剪：避免无关记忆层注入</text>
<text x="960" y="628" text-anchor="#5D6D7E" class="compare-text" xml:space="preserve">② 结构化精简：key-value 替代 chunk JSON</text>
<text x="960" y="646" text-anchor="#5D6D7E" class="compare-text" xml:space="preserve">③ 去元数据：无 scores/ranks/url 开销</text>
<text x="960" y="664" text-anchor="#5D6D7E" class="compare-text" xml:space="preserve">④ Tool 节点高频调用 (15次)，节省放大</text>
</svg>