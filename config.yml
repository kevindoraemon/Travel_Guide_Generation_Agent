stages:
  prod:
    cognition:
      openai:
        base_url: https://open.bigmodel.cn/api/coding/paas/v4
        api_key: ${OPENAI_API_KEY}
        organization: bigmodel
        default_model: glm-5.1
        temperature: 0
        timeout_seconds: 600
        models:
          glm-5.1:
            max_tokens: 128000
    search:
      backend: tavily
      tavily:
        api_key: ${TAVILY_API_KEY}
        base_url: https://api.tavily.com
        max_results: 3
        topic: general
        include_raw_content: true
        timeout_seconds: 300
    mcp:                      # MCP 服务配置（基于高德地图，提供天气/POI/路径规划等旅游工具）
      server_module: travel_planner.mcp.travel_server   # MCP 服务端模块
      amap_api_key: ${AMAP_MAPS_API_KEY}
