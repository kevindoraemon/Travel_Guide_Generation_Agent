    roles:
      rag_query:
        backend: openai
        handle: glm-5.1
        max_tokens: 800
        timeout_seconds: 60
      coordinator:          # 协调官：调度多个情报员并行搜集 + 触发精修/评分/挑刺的自进化循环
        backend: openai
        handle: glm-5.1
        max_tokens: 4000
        timeout_seconds: 600
      critic:               # 路书体验官：对抗式挑刺，发现行程冲突/需求偏离（用更强模型）
        backend: openai
        handle: glm-5
        max_tokens: 3000
        timeout_seconds: 600
      context_pruner:
        backend: openai
        handle: glm-5.1
        max_tokens: 4000
        timeout_seconds: 600
      scout_main:           # 情报员主模型：景点/交通/住宿/美食/门票/天气等网络搜集
        backend: openai
        handle: glm-5.1
        max_tokens: 3000
        timeout_seconds: 600
      scout_summarizer:     # 情报员-网页摘要：把搜索到的长网页压缩为关键信息
        backend: openai
        handle: glm-5.1
        max_tokens: 4000
        timeout_seconds: 600
      scout_compressor:     # 情报员-情报压缩：清理/去重/逐字保留关键事实
        backend: openai
        handle: glm-5.1
        max_tokens: 4000
        timeout_seconds: 600
      writer:               # 最终路书撰写
        backend: openai
        handle: glm-5.1
        max_tokens: 8000
        timeout_seconds: 600
      briefing:             # 简报官：把用户出行需求整理为出行简报并起草路书
        backend: openai
        handle: glm-5.1
        max_tokens: 4000
        timeout_seconds: 600
      evaluator:            # 路书评估器：可执行性/预算合理性/体验丰富度 三维自进化评分
        backend: openai
        handle: glm-5.1
        max_tokens: 2000
        timeout_seconds: 600
      benchmark_evaluator:  # A/B 留出裁判：不参与 TTD-DR 的生成和终止决策
        backend: openai
        handle: glm-5
        max_tokens: 2500
        timeout_seconds: 600
